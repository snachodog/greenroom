<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenroom setup</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <form class="setup" id="form">
    <nav><a href="/settings.html">Settings</a></nav>
    <h1>Start a session</h1>
    <label>Stream title <input name="title" required maxlength="120" autofocus></label>
    <label>Category
      <input name="category" id="category" list="categories" required autocomplete="off" placeholder="Start typing to search categories">
      <datalist id="categories"></datalist>
    </label>
    <label>Chat rate
      <select name="rate">
        <option value="quiet">Quiet</option>
        <option value="normal" selected>Normal</option>
        <option value="busy">Busy</option>
      </select>
    </label>
    <button type="submit">Start</button>
    <p class="hint" id="error"></p>
  </form>
  <script type="module">
    if (navigator.userAgent.includes('OBS')) location.replace('/');
    const form = document.getElementById('form');
    const input = document.getElementById('category');
    const byLower = new Map();
    const loaded = fetch('/api/categories').then((r) => r.json()).then(({ categories }) => {
      const list = document.getElementById('categories');
      categories.forEach((name) => {
        byLower.set(name.toLowerCase(), name);
        list.append(Object.assign(document.createElement('option'), { value: name }));
      });
    });
    const check = () => {
      const match = byLower.get(input.value.trim().toLowerCase());
      input.setCustomValidity(match ? '' : 'Choose a category from the list.');
      return match;
    };
    input.addEventListener('input', check);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await loaded;
      const category = check();
      if (!category) return input.reportValidity();
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ ...data, category }),
      });
      if (res.ok) location.href = '/';
      else document.getElementById('error').textContent = 'Could not start the session.';
    });
  </script>
</body>
</html>
