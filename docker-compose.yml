services:
  greenroom:
    image: ghcr.io/snachodog/greenroom:latest
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - greenroom-data:/data

volumes:
  greenroom-data:
